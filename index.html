<title>Print Bakery 발주 대시보드</title>
<style>
:root{
  --bg:#F3F4F1; --panel:#FFFFFF; --panel-2:#F8F9F7;
  --ink-900:#15191B; --ink-600:#545B57; --ink-400:#7C857F;
  --line:#DCE0DA; --line-strong:#C3C9C0;
  --accent:#0E6E6E; --accent-ink:#FFFFFF;
  --ok-bg:#E5F3EA; --ok-fg:#1F6B41;
  --warn-bg:#FBF0DC; --warn-fg:#8A5A0F;
  --crit-bg:#FBE7E3; --crit-fg:#9A3324;
  --neutral-bg:#EDEEEB; --neutral-fg:#5B625D;
  --shadow: 0 1px 2px rgba(21,25,27,0.06), 0 1px 1px rgba(21,25,27,0.04);
  --radius: 10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12100A ; --bg:#101413; --panel:#171C1B; --panel-2:#1D2321;
    --ink-900:#E9ECE8; --ink-600:#A7B0AB; --ink-400:#7A827D;
    --line:#2A312F; --line-strong:#3A4340;
    --accent:#33B3AB; --accent-ink:#08201E;
    --ok-bg:#173325; --ok-fg:#78D89B;
    --warn-bg:#3A2C10; --warn-fg:#E4B863;
    --crit-bg:#3A1D17; --crit-fg:#F2988A;
    --neutral-bg:#232928; --neutral-fg:#9AA39D;
    --shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --bg:#101413; --panel:#171C1B; --panel-2:#1D2321;
  --ink-900:#E9ECE8; --ink-600:#A7B0AB; --ink-400:#7A827D;
  --line:#2A312F; --line-strong:#3A4340;
  --accent:#33B3AB; --accent-ink:#08201E;
  --ok-bg:#173325; --ok-fg:#78D89B;
  --warn-bg:#3A2C10; --warn-fg:#E4B863;
  --crit-bg:#3A1D17; --crit-fg:#F2988A;
  --neutral-bg:#232928; --neutral-fg:#9AA39D;
  --shadow: 0 1px 2px rgba(0,0,0,0.4);
}
:root[data-theme="light"]{
  --bg:#F3F4F1; --panel:#FFFFFF; --panel-2:#F8F9F7;
  --ink-900:#15191B; --ink-600:#545B57; --ink-400:#7C857F;
  --line:#DCE0DA; --line-strong:#C3C9C0;
  --accent:#0E6E6E; --accent-ink:#FFFFFF;
  --ok-bg:#E5F3EA; --ok-fg:#1F6B41;
  --warn-bg:#FBF0DC; --warn-fg:#8A5A0F;
  --crit-bg:#FBE7E3; --crit-fg:#9A3324;
  --neutral-bg:#EDEEEB; --neutral-fg:#5B625D;
  --shadow: 0 1px 2px rgba(21,25,27,0.06), 0 1px 1px rgba(21,25,27,0.04);
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink-900);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{ font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace; font-variant-numeric:tabular-nums; }

.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--panel); border-bottom:1px solid var(--line);
  padding:16px 24px;
}
.topbar-row{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.brand{ display:flex; flex-direction:column; gap:2px; margin-right:8px; }
.brand .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:700; }
.brand h1{ margin:0; font-size:19px; font-weight:800; letter-spacing:-0.01em; text-wrap:balance; }

.search-wrap{ position:relative; flex:1 1 320px; max-width:460px; }
.search-wrap input{
  width:100%; padding:9px 14px 9px 34px; border-radius:999px;
  border:1px solid var(--line-strong); background:var(--panel-2); color:var(--ink-900);
  font-size:13.5px; outline:none; transition:border-color .15s, box-shadow .15s;
}
.search-wrap input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--ink-400); }
.search-hint{ font-size:11.5px; color:var(--ink-400); margin-top:4px; padding-left:14px; }

.chips{ display:flex; gap:6px; flex-wrap:wrap; }
.chip{
  border:1px solid var(--line-strong); background:var(--panel-2); color:var(--ink-600);
  padding:6px 13px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer;
  white-space:nowrap; transition:all .12s;
}
.chip:hover{ border-color:var(--accent); color:var(--ink-900); }
.chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.chip .cnt{ opacity:.7; font-weight:500; margin-left:3px; }

.view-toggle{ display:flex; gap:4px; margin-left:auto; }
.view-toggle button{
  border:1px solid var(--line-strong); background:var(--panel-2); color:var(--ink-600);
  padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
}
.view-toggle button:first-child{ border-radius:8px 0 0 8px; }
.view-toggle button:last-child{ border-radius:0 8px 8px 0; }
.view-toggle button.active{ background:var(--ink-900); border-color:var(--ink-900); color:var(--bg); }

main{ max-width:1360px; margin:0 auto; padding:22px 24px 60px; }

.stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px; margin-bottom:20px; }
.stat{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; box-shadow:var(--shadow);
}
.stat .label{ font-size:11.5px; color:var(--ink-400); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
.stat .num{ font-size:26px; font-weight:800; margin-top:4px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-variant-numeric:tabular-nums; }
.stat.warn .num{ color:var(--warn-fg); }
.stat.crit .num{ color:var(--crit-fg); }

section.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden; margin-bottom:22px;
}
.panel-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  padding:14px 18px; border-bottom:1px solid var(--line); background:var(--panel-2);
}
.panel-head h2{ margin:0; font-size:14.5px; font-weight:800; }
.panel-head .sub{ font-size:12px; color:var(--ink-400); }

.table-scroll{ overflow-x:auto; overflow-y:auto; max-height:64vh; }
table{ width:100%; border-collapse:collapse; font-size:13px; min-width:1120px; }
thead th{
  text-align:left; padding:9px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--ink-400); font-weight:700; border-bottom:1px solid var(--line); white-space:nowrap;
  position:sticky; top:0; background:var(--panel); z-index:5;
}
tbody td{ padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
tbody tr:hover{ background:var(--panel-2); }
tbody tr:last-child td{ border-bottom:none; }

.thumb{
  width:40px; height:40px; border-radius:6px; object-fit:cover;
  border:1px solid var(--line); background:var(--neutral-bg); display:block;
}
.thumb.empty{ display:flex; align-items:center; justify-content:center; color:var(--ink-400); font-size:9px; }

.kind-tag{
  display:inline-block; padding:2px 8px; border-radius:5px; font-size:11px; font-weight:700;
  background:var(--neutral-bg); color:var(--neutral-fg); white-space:nowrap;
}
.kind-포스터출력{ background:#E4ECF7; color:#2B5A9E; }
.kind-미진사{ background:#EAE4F7; color:#5B3E9E; }
.kind-미소액자{ background:#F7EDE4; color:#9E5E2B; }
.kind-디아섹{ background:#E4F3EE; color:#237A5E; }
@media (prefers-color-scheme:dark){
  .kind-포스터출력{ background:#1E2C40; color:#8FB4E8; }
  .kind-미진사{ background:#2A2140; color:#B9A3EE; }
  .kind-미소액자{ background:#3A2A1B; color:#E8B98C; }
  .kind-디아섹{ background:#173428; color:#7FD6B4; }
}
:root[data-theme="dark"] .kind-포스터출력{ background:#1E2C40; color:#8FB4E8; }
:root[data-theme="dark"] .kind-미진사{ background:#2A2140; color:#B9A3EE; }
:root[data-theme="dark"] .kind-미소액자{ background:#3A2A1B; color:#E8B98C; }
:root[data-theme="dark"] .kind-디아섹{ background:#173428; color:#7FD6B4; }
:root[data-theme="light"] .kind-포스터출력{ background:#E4ECF7; color:#2B5A9E; }
:root[data-theme="light"] .kind-미진사{ background:#EAE4F7; color:#5B3E9E; }
:root[data-theme="light"] .kind-미소액자{ background:#F7EDE4; color:#9E5E2B; }
:root[data-theme="light"] .kind-디아섹{ background:#E4F3EE; color:#237A5E; }

.name-cell{ max-width:230px; }
.name-cell .nm{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.name-cell .code{ font-size:11px; color:var(--ink-400); }

.pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap; }
.pill::before{ content:""; width:6px; height:6px; border-radius:50%; }
.pill.ok{ background:var(--ok-bg); color:var(--ok-fg); } .pill.ok::before{ background:var(--ok-fg); }
.pill.warn{ background:var(--warn-bg); color:var(--warn-fg); } .pill.warn::before{ background:var(--warn-fg); }
.pill.crit{ background:var(--crit-bg); color:var(--crit-fg); } .pill.crit::before{ background:var(--crit-fg); }
.pill.neutral{ background:var(--neutral-bg); color:var(--neutral-fg); } .pill.neutral::before{ background:var(--neutral-fg); }

.hl{ background:color-mix(in srgb, var(--accent) 28%, transparent); border-radius:2px; padding:0 1px; }

.mj-alert{
  display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
  border-radius:6px; background:var(--warn-bg); color:var(--warn-fg); font-size:12px; cursor:help;
  margin-left:6px; flex:none;
}
.status-cell{ display:flex; align-items:center; }

.reveal-row td{ padding:0; border-bottom:none; }
.reveal-btn{
  width:100%; padding:10px 12px; border:none; background:var(--panel-2); color:var(--ink-600);
  font-size:12.5px; font-weight:700; cursor:pointer; text-align:center; border-top:1px dashed var(--line);
}
.reveal-btn:hover{ color:var(--ink-900); background:var(--neutral-bg); }
.done-row{ opacity:.75; }

.empty-state{ padding:48px 20px; text-align:center; color:var(--ink-400); }
.empty-state svg{ width:34px; height:34px; margin-bottom:10px; opacity:.5; }

.inv-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:10px; padding:16px; }
.inv-card{
  border:1px solid var(--line); border-radius:9px; padding:10px; display:flex; gap:10px;
  background:var(--panel-2);
}
.inv-card img, .inv-card .thumb{ width:52px; height:52px; border-radius:7px; flex:none; }
.inv-card .body{ min-width:0; flex:1; }
.inv-card .nm{ font-weight:700; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.inv-card .meta{ font-size:11px; color:var(--ink-400); margin-top:1px; }
.inv-card .qtyrow{ display:flex; gap:10px; margin-top:6px; font-size:11.5px; }
.inv-card .qtyrow b{ font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; color:var(--ink-900); }
.inv-card .qtyrow.low b{ color:var(--crit-fg); }
.inv-card{ flex-direction:column; }
.inv-card .top{ display:flex; gap:10px; }
.sale-btn{
  margin-top:8px; align-self:flex-start; padding:3px 10px; border-radius:999px; border:1px solid var(--line-strong);
  background:var(--panel); color:var(--accent); font-size:11px; font-weight:700; cursor:pointer;
}
.sale-btn:hover{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.sale-form{ display:none; margin-top:8px; gap:6px; flex-direction:column; }
.sale-form.open{ display:flex; }
.sale-form input{
  padding:6px 8px; border-radius:6px; border:1px solid var(--line-strong); background:var(--panel); color:var(--ink-900); font-size:12px;
}
.sale-form .row{ display:flex; gap:6px; }
.sale-form .row input:first-child{ flex:2; }
.sale-form .row input:last-child{ flex:1; }
.sale-form button{
  padding:6px 10px; border-radius:6px; border:none; background:var(--accent); color:var(--accent-ink);
  font-size:12px; font-weight:700; cursor:pointer;
}
.sale-form button:disabled{ opacity:.5; cursor:default; }
.sale-msg{ font-size:11px; margin-top:2px; }
.sale-msg.err{ color:var(--crit-fg); }
.sale-msg.ok{ color:var(--ok-fg); }

footer{ text-align:center; color:var(--ink-400); font-size:11.5px; padding:20px 0 10px; }

@media (max-width:720px){
  main{ padding:16px; }
  .topbar{ padding:12px 16px; }
  table{ min-width:900px; }
}
</style>

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function parseDate(s){
  if(!s) return null;
  const m = String(s).match(/(\d{4})[.\-\s]+(\d{1,2})[.\-\s]+(\d{1,2})/);
  if(!m) return null;
  return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
}
function isExcludedMonth(dueStr){
  const d = parseDate(dueStr);
  if(!d) return false;
  const mo = d.getMonth()+1;
  return mo===3 || mo===4;
}
function isDone(status){
  return !!status && status.includes('완료') && !status.includes('필요');
}
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
function daysFromToday(d){
  if(!d) return null;
  return Math.round((d - TODAY) / 86400000);
}
function mjAlert(o){
  if(o.kind !== '미진사') return '';
  const due = parseDate(o.due_date);
  const diff = daysFromToday(due);
  if(diff===null || diff < -3 || diff > 1) return '';
  const mj = o.mj;
  const missing = [];
  if(!mj || !mj.quick_done) missing.push('퀵요청');
  if(!mj || !mj.process) missing.push('처리방식(주문서/입고기안)');
  if(!mj || !mj.deposit_done) missing.push('선수금 처리');
  if(!missing.length) return '';
  return '<span class="mj-alert" title="완성일 임박 · 확인 필요: '+missing.join(', ')+'">!</span>';
}
function img(url, size){
  if(url && IMG_MAP[url]) return '<img class="thumb" style="width:'+size+'px;height:'+size+'px" src="'+IMG_MAP[url]+'" alt="" />';
  return '<div class="thumb empty" style="width:'+size+'px;height:'+size+'px">—</div>';
}
function statusPill(status){
  if(!status) return '<span class="pill neutral">진행중</span>';
  let cls = 'neutral';
  if(status.includes('완료') && !status.includes('필요')) cls='ok';
  else if(status.includes('필요') || status.includes('대기')) cls='warn';
  else if(status.includes('예정')) cls='neutral';
  return '<span class="pill '+cls+'">'+esc(status)+'</span>';
}
function hl(text, q){
  text = esc(text);
  if(!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx<0) return text;
  return text.slice(0,idx) + '<span class="hl">' + text.slice(idx, idx+q.length) + '</span>' + text.slice(idx+q.length);
}

const KIND_ORDER = ['전체','포스터출력','미진사','미소액자','디아섹'];
let activeKind = '전체';
let query = '';

function kindCounts(){
  const c = {'전체': ORDERS.length};
  ORDERS.forEach(o => c[o.kind] = (c[o.kind]||0)+1);
  return c;
}

function renderChips(){
  const counts = kindCounts();
  const wrap = document.getElementById('kindChips');
  wrap.innerHTML = KIND_ORDER.map(k =>
    '<button class="chip'+(k===activeKind?' active':'')+'" data-kind="'+k+'">'+k+'<span class="cnt">'+(counts[k]||0)+'</span></button>'
  ).join('');
  wrap.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => { activeKind = btn.dataset.kind; renderChips(); renderOrders(); });
  });
}

function matches(o, q){
  if(!q) return true;
  q = q.toLowerCase();
  return (o.order_no && o.order_no.toLowerCase().includes(q)) ||
         (o.name && o.name.toLowerCase().includes(q)) ||
         (o.customer && o.customer.toLowerCase().includes(q)) ||
         (o.code && o.code.toLowerCase().includes(q));
}

function renderStats(){
  const total = ORDERS.length;
  const pending = ORDERS.filter(o => o.status && (o.status.includes('필요')||o.status.includes('대기'))).length;
  const done = ORDERS.filter(o => o.status && o.status.includes('완료') && !o.status.includes('필요')).length;
  const inv_low = INVENTORY.filter(i => {
    const r = parseFloat(i.remain !== undefined ? i.remain : i.qty);
    return !isNaN(r) && r <= 20;
  }).length;
  document.getElementById('stats').innerHTML = [
    ['전체 발주', total, ''],
    ['처리 필요', pending, 'warn'],
    ['완료', done, ''],
    ['재고 부족(≤20)', inv_low, 'crit'],
  ].map(([label,num,cls]) => '<div class="stat '+cls+'"><div class="label">'+label+'</div><div class="num mono">'+num+'</div></div>').join('');
}

let showDone = false;

function rowHtml(o){
  return '<tr class="'+(isDone(o.status)?'done-row':'')+'">' +
      '<td>'+img(o.img, 40)+'</td>' +
      '<td><span class="kind-tag kind-'+esc(o.kind)+'">'+esc(o.kind)+'</span></td>' +
      '<td class="name-cell"><div class="nm">'+hl(o.name||'(품목명 없음)', query)+'</div><div class="code mono">'+esc(o.code)+'</div></td>' +
      '<td class="mono">'+esc(o.qty)+'</td>' +
      '<td class="mono">'+esc(o.order_date)+'</td>' +
      '<td class="mono">'+esc(o.due_date)+'</td>' +
      '<td class="mono">'+hl(o.order_no, query)+'</td>' +
      '<td>'+esc(o.manager)+'</td>' +
      '<td>'+hl(o.customer, query)+'</td>' +
      '<td class="status-cell">'+statusPill(o.status)+mjAlert(o)+'</td>' +
    '</tr>';
}

function renderOrders(){
  let rows = ORDERS.filter(o => (activeKind==='전체' || o.kind===activeKind) && matches(o, query) && !isExcludedMonth(o.due_date));
  rows.sort((a,b) => {
    const da = parseDate(a.due_date), db = parseDate(b.due_date);
    if(!da && !db) return 0;
    if(!da) return 1;
    if(!db) return -1;
    return db - da;
  });

  const forceShowDone = !!query;
  const activeRows = rows.filter(o => !isDone(o.status));
  const doneRows = rows.filter(o => isDone(o.status));

  document.getElementById('ordersSub').textContent = rows.length + '건 (3개월-4개월 제외, 입고예정일 최신순)';
  const body = document.getElementById('ordersBody');
  document.getElementById('ordersEmpty').style.display = rows.length ? 'none' : 'block';

  let html = activeRows.map(rowHtml).join('');
  if(doneRows.length){
    if(forceShowDone || showDone){
      html += doneRows.map(rowHtml).join('');
      html += '<tr class="reveal-row"><td colspan="10"><button class="reveal-btn" id="toggleDoneBtn">완료된 항목 숨기기 ▲</button></td></tr>';
    } else {
      html += '<tr class="reveal-row"><td colspan="10"><button class="reveal-btn" id="toggleDoneBtn">완료된 항목 '+doneRows.length+'건 더 보기 ▾</button></td></tr>';
    }
  }
  body.innerHTML = html;

  const toggleBtn = document.getElementById('toggleDoneBtn');
  if(toggleBtn){
    toggleBtn.addEventListener('click', () => { showDone = !showDone; renderOrders(); });
  }
}

function renderInventory(){
  document.getElementById('invGrid').innerHTML = INVENTORY.map((i, idx) => {
    const remain = i.remain !== undefined && i.remain !== '' ? i.remain : i.qty;
    const low = !isNaN(parseFloat(remain)) && parseFloat(remain) <= 20;
    const canSell = i.kind === SALE_ENABLED_KIND;
    return '<div class="inv-card" data-idx="'+idx+'">' +
      '<div class="top">' + img(i.img, 52) +
        '<div class="body">' +
          '<div class="nm">'+esc(i.name)+'</div>' +
          '<div class="meta">'+esc(i.variant||'')+(i.spec?(' · '+esc(i.spec)):'')+'</div>' +
          '<div class="qtyrow'+(low?' low':'')+'">' +
            '<span>전체 <b class="qty-total">'+esc(i.qty)+'</b></span>' +
            (i.remain!==undefined ? '<span>잔여 <b class="qty-remain">'+esc(i.remain)+'</b></span>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +
      (canSell ? (
        '<button class="sale-btn" data-action="toggle" data-idx="'+idx+'">판매</button>' +
        '<div class="sale-form" id="saleForm'+idx+'">' +
          '<div class="row">' +
            '<input type="text" placeholder="주문번호" id="saleOrderNo'+idx+'" />' +
            '<input type="number" min="1" placeholder="수량" id="saleQty'+idx+'" />' +
          '</div>' +
          '<button data-action="submit" data-idx="'+idx+'">기록하기</button>' +
          '<div class="sale-msg" id="saleMsg'+idx+'"></div>' +
        '</div>'
      ) : '') +
    '</div>';
  }).join('');

  document.getElementById('invGrid').querySelectorAll('[data-action="toggle"]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('saleForm'+btn.dataset.idx).classList.toggle('open');
    });
  });
  document.getElementById('invGrid').querySelectorAll('[data-action="submit"]').forEach(btn => {
    btn.addEventListener('click', () => submitSale(parseInt(btn.dataset.idx, 10)));
  });
}

function submitSale(idx){
  const item = INVENTORY[idx];
  const orderNoEl = document.getElementById('saleOrderNo'+idx);
  const qtyEl = document.getElementById('saleQty'+idx);
  const msgEl = document.getElementById('saleMsg'+idx);
  const btn = document.querySelector('#saleForm'+idx+' [data-action="submit"]');
  const orderNo = orderNoEl.value.trim();
  const qty = parseInt(qtyEl.value, 10);

  msgEl.className = 'sale-msg';
  if(!orderNo || !qty || qty < 1){
    msgEl.textContent = '주문번호와 수량을 입력해주세요.';
    msgEl.classList.add('err');
    return;
  }

  btn.disabled = true;
  msgEl.textContent = '기록 중...';

  fetch(SALE_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ code: item.code, color: item.variant, orderNo: orderNo, qty: qty }),
  })
    .then(r => r.json())
    .then(data => {
      btn.disabled = false;
      if(!data.ok){
        msgEl.textContent = '실패: ' + (data.error || '알 수 없는 오류');
        msgEl.classList.add('err');
        return;
      }
      msgEl.textContent = '기록 완료! 잔여 ' + data.remain;
      msgEl.classList.add('ok');
      item.remain = data.remain;
      const card = document.querySelector('.inv-card[data-idx="'+idx+'"]');
      if(card) card.querySelector('.qty-remain').textContent = data.remain;
      orderNoEl.value = '';
      qtyEl.value = '';
    })
    .catch(err => {
      btn.disabled = false;
      msgEl.textContent = '네트워크 오류: ' + err;
      msgEl.classList.add('err');
    });
}

document.getElementById('search').addEventListener('input', (e) => {
  query = e.target.value.trim();
  document.getElementById('searchHint').textContent = query ?
    ('"'+query+'" 검색 중 — 발주일 · 담당자 정보가 표에 함께 표시됩니다') : ' ';
  renderOrders();
});

document.getElementById('btnOrders').addEventListener('click', () => {
  document.getElementById('btnOrders').classList.add('active');
  document.getElementById('btnInventory').classList.remove('active');
  document.getElementById('ordersPanel').style.display = '';
  document.getElementById('invPanel').style.display = 'none';
});
document.getElementById('btnInventory').addEventListener('click', () => {
  document.getElementById('btnInventory').classList.add('active');
  document.getElementById('btnOrders').classList.remove('active');
  document.getElementById('invPanel').style.display = '';
  document.getElementById('ordersPanel').style.display = 'none';
});

renderChips();
renderStats();
renderOrders();
renderInventory();
</script>
